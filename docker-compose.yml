version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - event-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: '0'
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: 'false'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'true'
    ports:
      - "29092:29092"
    networks:
      - event-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - event-network
    restart: unless-stopped

  users_db:
    image: postgres:16-alpine
    container_name: users_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - users_data:/var/lib/postgresql/data
    networks:
      - event-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events_db:
    image: postgres:16-alpine
    container_name: events_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events_db
    ports:
      - "5434:5432"
    volumes:
      - events_data:/var/lib/postgresql/data
    networks:
      - event-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings_db:
    image: postgres:16-alpine
    container_name: bookings_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookings_db
    ports:
      - "5435:5432"
    volumes:
      - bookings_data:/var/lib/postgresql/data
    networks:
      - event-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  users_service:
    build:
      context: .
      dockerfile: Services/Users/Presentation/Dockerfile
    container_name: users_service
    depends_on:
      - users_db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=users_db;Port=5432;Database=users_db;Username=postgres;Password=postgres
      - JwtSettings__Secret=SECRET_KEY_MINIMUM_32_CHARACTERS
      - JwtSettings__Issuer=EventManagement
      - JwtSettings__Audience=EventManagementClient
      - Otlp__Endpoint=http://jaeger:4317
    ports:
      - "5001:8080"
    networks:
      - event-network

  events_service:
    build:
      context: .
      dockerfile: Services/Events/Presentation/Dockerfile
    container_name: events_service
    depends_on:
      - events_db
      - kafka
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=events_db;Port=5432;Database=events_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__ConsumerGroup=events-service-group
      - JwtSettings__Secret=SECRET_KEY_MINIMUM_32_CHARACTERS
      - JwtSettings__Issuer=EventManagement
      - JwtSettings__Audience=EventManagementClient
      - Otlp__Endpoint=http://jaeger:4317
    ports:
      - "5002:8080"
    networks:
      - event-network

  bookings_service:
    build:
      context: .
      dockerfile: Services/Bookings/Presentation/Dockerfile
    container_name: bookings_service
    depends_on:
      - bookings_db
      - kafka
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=bookings_db;Port=5432;Database=bookings_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=kafka:9092
      - JwtSettings__Secret=SECRET_KEY_MINIMUM_32_CHARACTERS
      - JwtSettings__Issuer=EventManagement
      - JwtSettings__Audience=EventManagementClient
      - Otlp__Endpoint=http://jaeger:4317
    ports:
      - "5003:8080"
    networks:
      - event-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eventapi-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - event-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: eventapi-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    networks:
      - event-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: eventapi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - event-network
    depends_on:
      - prometheus

networks:
  event-network:
    driver: bridge

volumes:
  users_data:
  events_data:
  bookings_data:
  grafana-data: